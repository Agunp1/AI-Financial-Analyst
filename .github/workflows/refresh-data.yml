# Refreshes Vittantra's free market data on GitHub's computers and commits the
# new CSVs; the online app (vittantra.streamlit.app) reloads by itself.
# Needs repo secrets FRED_API_KEY and SEC_USER_AGENT (see DEPLOY.md).
name: Refresh data

on:
  schedule:
    - cron: "17 22 * * 1-5"     # weekdays after the US close
    - cron: "41 6 * * 6"        # Saturday: also all US-listed stocks
  workflow_dispatch:             # "Run workflow" button
    inputs:
      us_market:
        description: "Also refresh all US-listed stocks (15-30 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: sec_cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - run: pip install -r requirements.txt
      - name: Run the pipeline
        run: |
          if [ "${{ github.event.schedule }}" = "41 6 * * 6" ] || [ "${{ inputs.us_market }}" = "true" ]; then
            python run_vittantra.py --us-market
          else
            python run_vittantra.py
          fi
      - name: Check the rules still hold
        run: python -m unittest test_governance_rules test_finance_formulas
      - name: Commit the new data
        run: |
          git config user.name "vittantra-bot"
          git config user.email "vittantra-bot@users.noreply.github.com"
          git add -A -- '*.csv' '*.md'
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%F)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
