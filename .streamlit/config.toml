[theme]
base = "light"
primaryColor = "#1F5C47"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F2EFE7"
textColor = "#1B2A24"
linkColor = "#7D6224"
borderColor = "#E4E1D8"
baseRadius = "6px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
chartCategoricalColors = ["#1F5C47", "#A9843A", "#9FB5AA", "#3F7F9C", "#7A5C8E", "#C9A961", "#5E8B73", "#B5654A"]

[theme.sidebar]
backgroundColor = "#123D30"
secondaryBackgroundColor = "#1B4A3B"
textColor = "#E7EFEA"
primaryColor = "#E0C77F"
borderColor = "#2A5A49"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
